[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monday-range-research"
version = "1.0.0"
description = "A reproducible study of BTC mean reversion after Monday-range sweeps"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Daniel Pajer"}]
dependencies = [
  "altair>=5.0,<7",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "requests>=2.31,<3",
  "streamlit>=1.45,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]
